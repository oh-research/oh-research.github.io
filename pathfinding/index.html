<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경로탐색 · Pathfinding</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230071e3'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#ffffff; --panel:#f5f5f7; --ink:#1d1d1f; --muted:#86868b; --line:#e3e3e8;
    --accent:#0071e3; --radius:18px; --shadow:0 6px 20px rgba(0,0,0,.08);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100dvh; overflow:hidden;
    padding:24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left));
    padding-top:calc(24px + env(safe-area-inset-top));
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  .head{ text-align:center; margin-bottom:clamp(24px,5vh,48px); }
  .head .ko{ font-size:clamp(24px,4vw,32px); font-weight:700; letter-spacing:.01em; }
  .head .en{ color:var(--muted); font-size:14px; letter-spacing:.16em; text-transform:uppercase; margin-top:6px; }
  .tiles{
    display:grid; gap:clamp(14px,2.4vw,22px);
    grid-template-columns:repeat(3, minmax(0,1fr));
    width:min(760px, 92vw);
  }
  .tile{
    aspect-ratio:1 / 1;
    display:flex; align-items:center; justify-content:center;
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); text-decoration:none; color:var(--ink);
    font-size:clamp(19px,2.4vw,25px); font-weight:700; letter-spacing:.01em;
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease, color .14s ease;
  }
  .tile:hover{
    transform:translateY(-4px); color:var(--accent); border-color:var(--accent);
    box-shadow:0 14px 32px rgba(0,113,227,.18);
  }
  .tile:active{ transform:translateY(-1px); }
  @media (max-width:520px){
    .tiles{ grid-template-columns:1fr; width:min(380px,92vw); gap:14px; }
    .tile{ aspect-ratio:auto; padding:26px; font-size:20px; }
  }
</style>
</head>
<body>
  <header class="head">
    <div class="ko">경로탐색</div>
    <div class="en">Pathfinding</div>
  </header>
  <nav class="tiles">
    <a class="tile" href="./pathfinding-viewer-bfs.html">BFS</a>
    <a class="tile" href="./pathfinding-viewer-dijkstra.html">Dijkstra</a>
    <a class="tile" href="./pathfinding-viewer-astar.html">A*</a>
  </nav>
</body>
</html>
