<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경로탐색 분할 뷰어 · A*</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f5f5f7; --ink:#1d1d1f; --muted:#86868b; --line:#e3e3e8;
    --unvisited:#f2f2f4; --queued:#dbeafe; --current:#2563eb; --done:#c7d2da;
    --path:#22c55e; --wall:#5b6470; --accent:#0071e3;
    --start:#34c759; --goal:#ff3b30; --costly:#f2cfc9;
    --radius:14px; --shadow:0 6px 20px rgba(0,0,0,.08);
    --btn:#ffffff;
    --cell:56px; --W:5;
  }
  * { box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",sans-serif; }
  button{ font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--btn); color:var(--ink);
    padding:8px 14px; border-radius:10px; transition:background .15s,box-shadow .15s,transform .05s; }
  button:hover:not(:disabled){ background:var(--panel); }
  button:active:not(:disabled){ transform:translateY(1px); }
  button:disabled{ opacity:.4; cursor:default; }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  button.primary:hover:not(:disabled){ background:#0064c8; }
  input[type=number]{ font:inherit; width:52px; padding:6px 8px; border:1px solid var(--line);
    border-radius:8px; text-align:center; }
  select{ font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  label{ font-size:14px; color:var(--muted); display:inline-flex; align-items:center; gap:6px; }

  /* 칠하기 종류 세그먼트 */
  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button{ border:0; border-radius:0; padding:7px 12px; background:#fff; color:var(--muted); font-weight:600; }
  .seg button + button{ border-left:1px solid var(--line); }
  .seg button.on{ background:var(--accent); color:#fff; }
  .seg button.on.cost{ background:#d9483b; }

  #app{ display:flex; flex-direction:column; min-height:100vh; user-select:none; -webkit-user-select:none; }
  input, select{ user-select:auto; -webkit-user-select:auto; }

  /* 상단바 */
  .topbar{ display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:14px 22px; border-bottom:1px solid var(--line); }
  .brand{ font-weight:800; font-size:19px; letter-spacing:-.02em; }
  .topbar .tools{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-left:auto; }

  /* 본문: 좌 절차문 / 우 격자 */
  .body{ flex:1; display:grid; grid-template-columns:minmax(300px,380px) 1fr; gap:24px; padding:22px; }
  @media (max-width:860px){ .body{ grid-template-columns:1fr; } }
  .left{ background:var(--panel); border-radius:var(--radius); padding:20px 22px; align-self:start; }
  .left h2{ margin:0 0 12px; font-size:15px; color:var(--muted); font-weight:700; }
  #proc{ margin:0; padding-left:0; list-style:none; counter-reset:p; }
  #proc > li{ position:relative; padding:10px 12px 10px 40px; margin-bottom:6px; border-radius:10px;
    line-height:1.5; color:#3a3a3c; counter-increment:p; }
  #proc > li::before{ content:counter(p); position:absolute; left:10px; top:10px; width:22px; height:22px;
    border-radius:50%; background:#e5e5ea; color:#6b6b70; font-size:13px; font-weight:700;
    display:grid; place-items:center; }
  #proc > li.active{ background:#fff; color:var(--ink); font-weight:700; box-shadow:var(--shadow); }
  #proc > li.active::before{ background:var(--accent); color:#fff; }
  #proc > li.pgrp{ background:rgba(0,113,227,.05); }
  #proc > li.pgrp > .txt{ font-weight:700; color:var(--ink); }
  .subproc{ list-style:none; margin:8px 0 2px; padding:0; }
  .subproc li{ position:relative; padding:8px 12px 8px 26px; margin:4px 0 0; border-radius:8px;
    color:#5a5a5e; line-height:1.5; }
  .subproc li::before{ content:''; position:absolute; left:12px; top:15px; width:6px; height:6px;
    border-radius:50%; background:#c4c4c9; }
  .subproc li.active{ background:#fff; color:var(--ink); font-weight:700; box-shadow:var(--shadow); }
  .subproc li.active::before{ background:var(--accent); }
  #procnote{ margin-top:12px; font-size:13px; color:var(--muted); line-height:1.55;
    padding:10px 12px; background:rgba(0,113,227,.06); border-radius:10px; }

  .right{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  #stage{ position:relative; }
  #arrows{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:2; }
  #arrows .thread{ stroke:#aab3c0; stroke-width:2; fill:none; opacity:.5;
    stroke-dasharray:3 4; stroke-linecap:round; }
  #arrows .thread-dot{ fill:#8b96a5; opacity:.6; }
  #arrows .route{ stroke:#16a34a; stroke-width:6; fill:none; stroke-linecap:round; stroke-linejoin:round;
    filter:drop-shadow(0 2px 4px rgba(22,163,74,.35)); }
  #grid{ display:grid; gap:6px; grid-template-columns:repeat(var(--W), var(--cell)); user-select:none; position:relative; z-index:1; }
  .cell{ position:relative; width:var(--cell); height:var(--cell); border-radius:12px; display:grid; place-items:center;
    font-weight:700; font-size:calc(var(--cell)*.34); background:var(--unvisited);
    box-shadow:0 3px 8px rgba(0,0,0,.05); transition:background .16s, outline-color .16s; }
  .cell .num{ font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace; }
  .cell .ico{ font-weight:800; }
  /* 비싼 칸(비용5) 표시: 좌상단 붉은 코너 + 편집/미방문 시 붉은 틴트 */
  .cell.c-costly::after{ content:''; position:absolute; top:0; left:0; border-width:0;
    border-style:solid; border-top-color:#d9483b; border-left-color:#d9483b;
    border-top-width:12px; border-left-width:12px; border-right:12px solid transparent;
    border-bottom:12px solid transparent; border-top-left-radius:12px; opacity:.9; }
  /* 재생 상태색 */
  .s-queued{ background:var(--queued); }
  .s-current{ background:#fff; outline:3px solid var(--current); }
  .s-done{ background:var(--done); }
  .s-path{ background:var(--path); color:#fff; outline:3px solid #16a34a; }
  .r-start{ outline:3px solid var(--start); }
  .r-goal{ outline:3px solid var(--goal); }
  .r-obstacle{ background:var(--wall);
    background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.14) 6px 12px); }
  .cell-examine{ outline:3px dashed #f59e0b; outline-offset:2px; z-index:3; }
  /* A* 전용 g/h/f 코너 숫자 (Dijkstra에서는 미사용) */
  .cell .g,.cell .h{ position:absolute; font-size:calc(var(--cell)*.2);
    font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace; color:#6b7280; font-weight:700; }
  .cell .g{ left:5px; bottom:3px; } .cell .h{ right:5px; bottom:3px; color:#b45309; }
  .cell.s-path .g,.cell.s-path .h{ color:#eafff0; }
  /* 편집 상태 */
  #app[data-mode="edit"] #grid{ cursor:crosshair; }
  #app[data-mode="play"] #grid .cell{ cursor:pointer; }
  .e-empty{ background:var(--unvisited); }
  .e-costly{ background:var(--costly); }
  .e-wall{ background:var(--wall);
    background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.14) 6px 12px); }
  .e-start{ background:var(--start); color:#fff; }
  .e-goal{ background:var(--goal); color:#fff; }

  .queuewrap{ display:flex; flex-direction:column; gap:8px; align-items:stretch; align-self:center;
    width:100%; max-width:560px; min-height:34px; }
  .qlabel{ font-size:13px; color:var(--muted); font-weight:700; }
  #queue{ display:grid; grid-template-columns:repeat(auto-fill, minmax(74px,1fr)); gap:5px; }
  .chip{ font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace; font-size:13px;
    padding:5px 4px; border-radius:8px; background:#eef1f4; color:#48484a; cursor:pointer;
    text-align:center; white-space:nowrap; }
  .chip .cv{ font-weight:800; color:#2563eb; }
  .chip.next{ background:var(--current); color:#fff; }
  .chip.next .cv{ color:#fff; }
  .chip.cur{ background:#fff; outline:2px solid var(--current); color:var(--current); font-weight:700; }
  .chip.done{ background:#f2f2f4; color:#b3b3b8; }   /* 처리 끝난 칸 — 연회색으로 남김(기록) */
  .chip.done .cv{ color:#b3b3b8; }
  .hint{ font-size:13px; color:var(--muted); text-align:center; max-width:560px; line-height:1.5; }

  /* 하단바 */
  .bottombar{ display:flex; align-items:center; gap:24px; flex-wrap:wrap;
    padding:14px 22px; border-top:1px solid var(--line); }
  .grp{ display:flex; align-items:center; gap:8px; }
  .vdiv{ width:1px; align-self:stretch; min-height:22px; background:var(--line); margin:0 6px; }
  #counter{ font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace; font-size:14px;
    min-width:96px; text-align:center; color:var(--muted); }
  .spacer{ margin-left:auto; }
</style>
</head>
<body>
<div id="app" data-mode="edit">

  <header class="topbar">
    <div class="brand">경로탐색 뷰어 · A*</div>
    <div class="tools">
      <label>예시
        <select id="selExample"></select>
      </label>
      <label>가로 <input id="inW" type="number" min="2" max="14" value="4"></label>
      <label>세로 <input id="inH" type="number" min="2" max="14" value="3"></label>
      <button id="btnApply">크기 적용</button>
      <span class="seg" id="brush">
        <button data-brush="wall" class="on">벽</button>
        <button data-brush="cost" class="cost">비싼 칸(5)</button>
      </span>
      <label>이웃 순서
        <select id="selOrder">
          <option value="ENWS">동북서남</option>
          <option value="NESW">북동남서</option>
        </select>
      </label>
      <label>③ 이웃 보기
        <select id="selGran">
          <option value="neighbor">하나씩 나눠서</option>
          <option value="dequeue">한 번에</option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" id="chkNumbers" checked> g·h·f 보기</label>
    </div>
  </header>

  <main class="body">
    <section class="left">
      <h2 id="proctitle">Dijkstra 절차</h2>
      <ol id="proc"></ol>
      <div id="procnote"></div>
    </section>
    <section class="right">
      <div id="stage"><div id="grid"></div><svg id="arrows"></svg></div>
      <div class="queuewrap"><span class="qlabel" id="qlabel">큐 · 연회색=꺼낸 칸(기록) · 오른쪽=대기(g 작은 순) · ▶ 다음에 꺼낼 칸</span><div id="queue"></div></div>
      <div id="hint" class="hint"></div>
    </section>
  </main>

  <footer class="bottombar">
    <div class="grp">
      <button id="btnClearWalls">벽·비용 지우기</button>
    </div>
    <div class="grp spacer">
      <button id="btnEdit">✎ 편집으로</button>
      <button id="btnRun" class="primary">▶ 탐색 시작</button>
      <span class="vdiv"></span>
      <button id="btnPrev">◀ 이전</button>
      <span id="counter">편집 중</span>
      <button id="btnNext">다음 ▶</button>
      <button id="btnPlay">▷ 재생</button>
    </div>
  </footer>

</div>

<script>
// =====================================================================
//  ALGO 선택 — 이 상수 하나로 Dijkstra(g) / A*(f=g+h) 전환.
//  (astar 파일은 ALGO='astar' 로만 다름. 엔진 본체는 두 파일 동일.)
// =====================================================================
const ALGO = 'astar';   // 'dij' | 'astar'

// ===ENGINE-START===  (DOM 비의존 · Node 헤드리스 검증 대상)
const NEIGHBOR_ORDERS = {
  ENWS: [[1,0],[0,1],[-1,0],[0,-1]], // 동북서남 (기본)
  NESW: [[0,1],[1,0],[0,-1],[-1,0]], // 북동남서 (대안: tie-break 시연)
};
const fmt = (c) => `(${c[0]},${c[1]})`;
const dirLabel = (dx,dy) => dx===1?'동':dx===-1?'서':dy===1?'북':'남';
const manhattan = (a,b) => Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]);
const PRIOLABEL = (ALGO==='astar') ? 'f' : 'g';   // 큐 정렬 기준 이름

// 우선순위: Dijkstra=g, A*=f=g+h
function prioOf(cell){ return (ALGO==='astar') ? cell.f : cell.g; }

// 검증된 트레이스 생성기 (노드가중: 진입 칸의 비용을 누적)
function buildTrace(map, orderKey, granularity='dequeue') {
  const order = NEIGHBOR_ORDERS[orderKey];
  const oLabel = orderKey==='NESW' ? '북동남서' : '동북서남';
  const fine = (granularity === 'neighbor');
  const { W, H, start, goal } = map;
  const key = (x,y) => `${x},${y}`;
  const inB = (x,y) => x>=0 && x<W && y>=0 && y<H;
  const obs = new Set((map.obstacles||[]).map(o=>key(o[0],o[1])));
  const costly = new Set((map.costly||[]).map(o=>key(o[0],o[1])));
  const weight = (x,y) => costly.has(key(x,y)) ? 5 : 1;
  const isObs = (x,y) => obs.has(key(x,y));

  const cells = {};
  for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
    let role = null;
    if (start[0]===x && start[1]===y) role='start';
    else if (goal[0]===x && goal[1]===y) role='goal';
    else if (isObs(x,y)) role='obstacle';
    cells[key(x,y)] = { x, y, role, w:weight(x,y),
      state:'unvisited', g:null, h:manhattan([x,y],goal), f:null, prev:null, seq:null };
  }
  const steps = [];
  let seq = 0;                       // 발견(큐 진입) 순서 — tie-break용
  let popSeq = 0;                    // 꺼낸(pop) 순서 — 완료 기록(왼쪽 연회색)용
  // 현재 큐(open) = state==='queued' 인 칸들. 스냅샷 저장 시 우선순위 정렬은 렌더가 담당.
  const openKeys = () => Object.values(cells).filter(c=>c.state==='queued');
  const snap = (extra) => ({
    cells: JSON.parse(JSON.stringify(cells)),
    // 큐 표시용: 현재 open을 (우선순위, seq)로 정렬한 좌표열
    queue: openKeys().sort((a,b)=> (prioOf(a)-prioOf(b)) || (a.seq-b.seq)).map(c=>[c.x,c.y]),
    ...extra,
  });
  const popMin = () => {
    const open = openKeys();
    if (!open.length) return null;
    open.sort((a,b)=> (prioOf(a)-prioOf(b)) || (a.seq-b.seq));
    return open[0];
  };

  // 초기화: 출발 칸
  const s = cells[key(start[0],start[1])];
  s.g = 0; s.f = s.g + s.h; s.state = 'queued'; s.seq = seq++;
  steps.push(snap({ deq:null, discovered:[[...start]], procLine:1, dk:0,
    caption: ALGO==='astar'
      ? `출발 ${fmt(start)}: g=0, f=g+h=${s.f} 로 큐에 넣는다.`
      : `출발 ${fmt(start)}: 비용 g=0 으로 큐에 넣는다.` }));

  let found = false;
  while (true) {
    const u = popMin();
    if (!u) break;
    u.state = 'current';
    u.porder = popSeq++;             // 꺼낸 순서 기록
    const uc = [u.x,u.y];

    if (u.role==='goal'){                       // 도착을 꺼내면 종료
      found = true;
      u.state = 'done';
      steps.push(snap({ deq:uc, discovered:[], procLine:'4',
        caption:`도착 ${fmt(uc)}을 꺼냈다 (비용 ${u.g}). 여기서 멈추고 실을 거꾸로 따라간다.` }));
      break;
    }

    if (fine) steps.push(snap({ deq:uc, discovered:[], procLine:2,
      caption:`제일 싼 칸 ${fmt(uc)}을 꺼낸다 (비용 g=${u.g}). 지금 이 칸을 본다.` }));

    const discovered = [];
    for (const [dx,dy] of order) {
      const nx=u.x+dx, ny=u.y+dy;
      if (!inB(nx,ny)) continue;
      const nc = cells[key(nx,ny)];
      const dName = dirLabel(dx,dy);
      if (nc.role==='obstacle'){
        if (fine) steps.push(snap({ deq:null, examine:[nx,ny], outcome:'skip', discovered:[], procLine:'3a',
          caption:`${dName}쪽 ${fmt([nx,ny])}은 벽이라 건너뛴다.` }));
        continue;
      }
      if (nc.state==='done'){
        if (fine) steps.push(snap({ deq:null, examine:[nx,ny], outcome:'closed', discovered:[], procLine:'3a',
          caption:`${dName}쪽 ${fmt([nx,ny])}은 이미 확정된 칸이라 건너뛴다.` }));
        continue;
      }
      const ng = u.g + nc.w;                     // 새 비용 = 꺼낸 비용 + 그 칸의 비용
      if (nc.state==='unvisited'){               // 처음 보는 칸
        nc.g = ng; nc.f = ng + nc.h; nc.prev = uc; nc.state='queued'; nc.seq = seq++;
        discovered.push([nx,ny]);
        if (fine) steps.push(snap({ deq:null, examine:[nx,ny], outcome:'add', discovered:[[nx,ny]], procLine:'3b',
          caption: ALGO==='astar'
            ? `${dName}쪽 ${fmt([nx,ny])}: 처음 보는 칸. g=${u.g}+${nc.w}=${ng}, f=${nc.f}. 큐에 넣고 실을 묶는다.`
            : `${dName}쪽 ${fmt([nx,ny])}: 처음 보는 칸. 새 비용 ${u.g}+${nc.w}=${ng}. 큐에 넣고 실을 묶는다.` }));
      } else {                                   // 이미 큐에 있는 칸 → 비교
        if (ng < nc.g){                          // 더 싸면 고쳐 쓰기(노드가중 격자에선 실제로 안 일어남)
          nc.g = ng; nc.f = ng + nc.h; nc.prev = uc; nc.seq = seq++;
          discovered.push([nx,ny]);
          if (fine) steps.push(snap({ deq:null, examine:[nx,ny], outcome:'update', discovered:[[nx,ny]], procLine:'3b', dk:1,
            caption:`${dName}쪽 ${fmt([nx,ny])}: 새 비용 ${ng} < 기존 ${nc.g}. 더 싸다! 비용을 고쳐 쓴다.` }));
        } else {
          if (fine) steps.push(snap({ deq:null, examine:[nx,ny], outcome:'nochange', discovered:[], procLine:'3b',
            caption:`${dName}쪽 ${fmt([nx,ny])}: 새 비용 ${ng} ≥ 기존 ${nc.g}. 더 싸지 않으니 안 고친다.` }));
        }
      }
    }

    u.state = 'done';
    if (!fine) steps.push(snap({ deq:uc, discovered, procLine:2,
      caption:`제일 싼 칸 ${fmt(uc)}을 꺼냈다 (비용 ${u.g}). 이웃을 ${oLabel} 순으로 확인.` }));
  }

  // 역추적 경로
  const gc = cells[key(goal[0],goal[1])];
  const reachable = gc.g !== null;
  const path = [];
  if (reachable){
    let p = [goal[0],goal[1]];
    while (p){ path.push(p); const pc = cells[key(p[0],p[1])]; p = pc.prev ? [pc.prev[0],pc.prev[1]] : null; }
    path.reverse();
    path.forEach(([x,y]) => { cells[key(x,y)].state = 'path'; });
  }
  steps.push(snap({ deq:null, discovered:[], procLine:5, isBacktrack:true, path, reachable,
    caption: reachable
      ? `최소 비용 경로 (총비용 ${gc.g}, ${path.length-1}걸음): ${path.map(fmt).join(' → ')}`
      : `도착 ${fmt(goal)}에 이르는 길이 없습니다. 벽으로 막혀 있어요.` }));

  return steps;
}

// 트레이스에서 '꺼낸(current→done) 칸' 수 세기 = 탐색량
function countExpanded(steps){
  const seen = new Set();
  for (const s of steps){ if (s.deq) seen.add(s.deq[0]+','+s.deq[1]); }
  return seen.size;
}
function pathOf(steps){
  const last = steps[steps.length-1];
  return last.path ? last.path.map(fmt).join(' ') : '';
}

// EXAMPLES 예시 맵 (검증됨). obstacles=벽, costly=비용5. 나머지 비용1.
const EXAMPLES = [
  { name:'예시 1 · 4×3 비용장벽', W:4, H:3, start:[0,0], goal:[3,2],
    obstacles:[[1,1],[3,0]], costly:[[1,0],[2,0]] },
  { name:'예시 2 · 3×3 벽 (무가중치·BFS와 공유)', W:3, H:3, start:[0,0], goal:[2,2],
    obstacles:[[1,1]], costly:[] },
  { name:'예시 3 · 5×4 대각비용 (Dijkstra와 공유)', W:5, H:4, start:[0,0], goal:[4,3],
    obstacles:[], costly:[[1,0],[1,1],[2,1],[2,2],[3,2]] },
  { name:'예시 4 · C2 5×5 (Dijkstra 대비)', W:5, H:5, start:[0,0], goal:[4,4], obstacles:[],
    costly:[[1,0],[2,0],[3,0],[4,0],[4,1],[0,2],[1,2],[4,2],[0,3],[1,3],[2,3],[0,4],[1,4],[2,4],[3,4]] },
  { name:'예시 5 · 15×9 개방 (A* 전용·큰 맵)', W:15, H:9, start:[0,0], goal:[7,8],
    obstacles:[], costly:[] },
];

// 자기검증 (DOM 비의존) — 인라인 픽스처(EXAMPLES 순서와 무관). astar 파일은 C2까지 확장.
function selfCheck(){
  const fails = [];
  const check = (name, map, cost, pops, path) => {
    const t = buildTrace(map, 'ENWS', 'dequeue');
    const g = t[t.length-1].cells[`${map.goal[0]},${map.goal[1]}`].g;
    if (g !== cost) fails.push(`${name} 비용 ${g}≠${cost}`);
    if (countExpanded(t) !== pops) fails.push(`${name} 꺼낸칸 ${countExpanded(t)}≠${pops}`);
    if (pathOf(t) !== path) fails.push(`${name} 경로 [${pathOf(t)}]`);
    if (t.reduce((a,s)=>a+(s.dk||0),0) !== 0) fails.push(`${name} 고쳐쓰기≠0`);
  };
  const C1 = { W:4,H:3, start:[0,0], goal:[3,2], obstacles:[[1,1],[3,0]], costly:[[1,0],[2,0]] };
  if (ALGO==='astar') check('C1', C1, 5, 6, '(0,0) (0,1) (0,2) (1,2) (2,2) (3,2)');
  else                 check('C1', C1, 5, 7, '(0,0) (0,1) (0,2) (1,2) (2,2) (3,2)');
  const t2 = buildTrace(C1, 'NESW', 'dequeue');   // 이웃순서 바꿔도 최적 비용 동일
  if (t2[t2.length-1].cells['3,2'].g !== 5) fails.push('C1(NESW) 비용≠5');
  const C2 = { W:5,H:5, start:[0,0], goal:[4,4], obstacles:[],
    costly:[[1,0],[2,0],[3,0],[4,0],[4,1],[0,2],[1,2],[4,2],[0,3],[1,3],[2,3],[0,4],[1,4],[2,4],[3,4]] };
  check('C2', C2, 8, 10, '(0,0) (0,1) (1,1) (2,1) (3,1) (3,2) (3,3) (4,3) (4,4)');
  return { ok: fails.length===0, fails };
}
// ===ENGINE-END===

// ===== PROC (절차문 — Dijkstra / A* 분기) =====
let procBuiltFor = null;
function orderLabel(key){ return key==='NESW' ? '북→동→남→서' : '동→북→서→남'; }
function procSteps(){
  const o = orderLabel(state.orderKey);
  if (ALGO==='astar') return [
    { pl:'1', text:'출발 칸은 g=0, f=g+h 로 큐에 넣는다. (h=목표까지 거리)' },
    { pl:'2', text:'큐에서 f=g+h가 제일 작은 칸을 꺼낸다.' },
    { pl:'3', text:`이웃을 ${o} 순서로 본다.`, subs:[
        { pl:'3a', text:'벽이거나 이미 확정된 칸이면 건너뛴다.' },
        { pl:'3b', text:'새 g = 꺼낸 g + 그 칸의 비용. 더 싸면 g를 고쳐 쓰고, f로 큐에 넣고 실을 묶는다.' },
      ] },
    { pl:'4', text:'도착을 꺼내면 멈춘다.' },
    { pl:'5', text:'도착에서 실을 거꾸로 따라가면 최소 비용 경로.' },
  ];
  return [
    { pl:'1', text:'출발 칸의 비용을 0으로 두고 큐에 넣는다.' },
    { pl:'2', text:'큐에서 제일 싼 칸(비용이 가장 작은 칸)을 꺼낸다.' },
    { pl:'3', text:`이웃을 ${o} 순서로 본다.`, subs:[
        { pl:'3a', text:'벽이거나 이미 확정된 칸이면 건너뛴다.' },
        { pl:'3b', text:'새 비용 = 꺼낸 비용 + 그 칸의 비용. 더 싸면 비용을 고쳐 쓰고 실을 묶는다.' },
      ] },
    { pl:'4', text:'도착을 꺼낼 때까지 2~3을 반복한다.' },
    { pl:'5', text:'도착에서 실을 거꾸로 따라가면 최소 비용 경로.' },
  ];
}
function buildProc(){
  $('proc').innerHTML = procSteps().map(s => {
    const subs = s.subs
      ? `<ul class="subproc">${s.subs.map(x=>`<li data-pl="${x.pl}"><span class="txt">${x.text}</span></li>`).join('')}</ul>`
      : '';
    return `<li data-pl="${s.pl}"><span class="txt">${s.text}</span>${subs}</li>`;
  }).join('');
}
function procNoteText(){
  if (ALGO==='astar')
    return "※ g=지금까지 든 비용, h=목표까지 남은 거리(맨해튼), f=g+h. Dijkstra는 g만 보고 A*는 g+h를 봅니다. h가 목표 쪽으로 당겨 덜 헤맵니다.";
  return state.showNumbers
    ? "※ 칸의 숫자 = 지금까지 든 비용 g. 늘 제일 싼 칸부터 꺼내므로, 처음 확정된 비용이 곧 최소 비용입니다."
    : "※ 비용 g를 끈 상태입니다. 큐(정렬)와 실만으로 최소 비용 길을 찾습니다.";
}

// ===== STATE =====
const state = {
  W:4, H:3,
  start:[0,0], goal:[3,2],
  walls: new Set(),          // "x,y" (장애물)
  costs: new Set(),          // "x,y" (비용5)
  brush: 'wall',             // 'wall' | 'cost'
  orderKey:"ENWS",
  granularity:"neighbor",
  showNumbers:true,
  mode:"edit",
  trace:null, i:0,
};
const kk = (x,y) => `${x},${y}`;
const eq = (a,b) => a[0]===b[0] && a[1]===b[1];
const inBounds = (x,y) => x>=0 && x<state.W && y>=0 && y<state.H;
function mapFromState(){
  return { W:state.W, H:state.H, start:[...state.start], goal:[...state.goal],
    obstacles:[...state.walls].map(s=>s.split(',').map(Number)),
    costly:[...state.costs].map(s=>s.split(',').map(Number)) };
}
function loadExample(idx){
  const ex = EXAMPLES[idx]; if(!ex) return;
  state.W = ex.W; state.H = ex.H;
  state.start = [...ex.start]; state.goal = [...ex.goal];
  state.walls = new Set((ex.obstacles||[]).map(o=>kk(o[0],o[1])));
  state.costs = new Set((ex.costly||[]).map(o=>kk(o[0],o[1])));
  state.mode = 'edit'; state.trace = null; state.i = 0;
  $('inW').value = state.W; $('inH').value = state.H;
  render();
}

// ===== RENDER =====
const $ = (id) => document.getElementById(id);
function sizeGrid(){
  const g = $('grid');
  const cell = Math.max(34, Math.min(72,
    Math.floor(Math.min((window.innerWidth*0.52)/state.W, (window.innerHeight*0.58)/state.H))));
  g.style.setProperty('--cell', cell+'px');
  g.style.setProperty('--W', state.W);
}
function newCell(x,y){
  const el = document.createElement('div');
  el.className = 'cell'; el.dataset.x = x; el.dataset.y = y;
  return el;
}
function cellNumbers(c){
  // ALGO별 칸 내부 숫자
  if (!state.showNumbers) return '';
  if (c.role==='start' || c.role==='goal') {
    // 출발/도착은 아이콘 유지 (A*는 g/h만 코너에)
  }
  if (ALGO==='astar'){
    if (c.g===null) return '';
    const g = `<span class="g">${c.g}</span>`;
    const h = `<span class="h">${c.h}</span>`;
    const f = (c.role==='start'||c.role==='goal') ? '' : `<span class="num">${c.f}</span>`;
    return g + h + f;
  }
  if (c.g!==null && c.role!=='start' && c.role!=='goal') return `<span class="num">${c.g}</span>`;
  return '';
}

function renderEditGrid(){
  sizeGrid();
  const g = $('grid'); g.innerHTML = '';
  for (let row=0; row<state.H; row++){
    const y = state.H-1-row;
    for (let x=0; x<state.W; x++){
      const el = newCell(x,y);
      if (eq([x,y],state.start)){ el.classList.add('e-start'); el.innerHTML = `<span class="ico">S</span>`; }
      else if (eq([x,y],state.goal)){ el.classList.add('e-goal'); el.innerHTML = `<span class="ico">G</span>`; }
      else if (state.walls.has(kk(x,y))) el.classList.add('e-wall');
      else if (state.costs.has(kk(x,y))){ el.classList.add('e-costly'); el.innerHTML = `<span class="num">5</span>`; }
      else el.classList.add('e-empty');
      g.appendChild(el);
    }
  }
}
function renderGrid(step){
  sizeGrid();
  const g = $('grid'); g.innerHTML = '';
  for (let row=0; row<state.H; row++){
    const y = state.H-1-row;
    for (let x=0; x<state.W; x++){
      const c = step.cells[kk(x,y)];
      const el = newCell(x,y);
      const examined = step.examine && step.examine[0]===x && step.examine[1]===y;
      el.className = `cell s-${c.state}` + (c.role?` r-${c.role}`:'')
        + (c.w===5 ? ' c-costly' : '') + (examined ? ' cell-examine' : '');
      el.dataset.x = x; el.dataset.y = y;
      let inner = cellNumbers(c);
      if (c.role==='start') inner = `<span class="ico">S</span>` + (ALGO==='astar'&&state.showNumbers?`<span class="h">${c.h}</span>`:'');
      if (c.role==='goal')  inner = `<span class="ico">G</span>`;
      el.innerHTML = inner;
      g.appendChild(el);
    }
  }
}
function renderQueue(step){
  const q = $('queue');
  if (!step){ q.innerHTML = ''; return; }
  const val = (c) => (ALGO==='astar') ? c.f : c.g;
  const chip = (c, cls, mark) =>
    `<span class="chip ${cls}" data-x="${c.x}" data-y="${c.y}">${mark||''}${fmt([c.x,c.y])}·<span class="cv">${val(c)}</span></span>`;
  // 왼쪽: 이미 꺼낸 칸(기록) — pop 순서대로. 완료=연회색, 지금 칸=cur
  const popped = Object.values(step.cells)
    .filter(c => c.porder !== undefined)
    .sort((a,b) => a.porder - b.porder)
    .map(c => chip(c, c.state==='current' ? 'cur' : 'done', ''));
  // 오른쪽: 대기(open) — 우선순위 오름차순(step.queue 이미 정렬). 맨 앞 ▶ = 다음 pop
  const front = step.queue.length ? `${step.queue[0][0]},${step.queue[0][1]}` : null;
  const open = step.queue.map(([x,y]) => {
    const c = step.cells[kk(x,y)];
    const isNext = front === `${x},${y}`;
    return chip(c, isNext ? 'next' : '', isNext ? '▶' : '');
  });
  q.innerHTML = popped.concat(open).join('');
}
function renderProc(step){
  if (!$('proc').children.length || procBuiltFor !== state.orderKey){ buildProc(); procBuiltFor = state.orderKey; }
  const pl = step ? String(step.procLine) : null;
  const strong = new Set(), group = new Set();
  if (pl){ strong.add(pl); if (pl==='3a' || pl==='3b') group.add('3'); }
  $('proc').querySelectorAll('li[data-pl]').forEach(li => {
    li.classList.toggle('active', strong.has(li.dataset.pl));
    li.classList.toggle('pgrp', group.has(li.dataset.pl));
  });
}

// ===== ANIM / SVG =====
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
const cellEl = (x,y) => document.querySelector(`#grid .cell[data-x="${x}"][data-y="${y}"]`);
function centerOf(x,y,srect){
  const el = cellEl(x,y); if(!el) return null;
  const r = el.getBoundingClientRect();
  return { x:r.left-srect.left+r.width/2, y:r.top-srect.top+r.height/2 };
}
function clearArrows(){ $('arrows').innerHTML = ''; }
function renderArrows(step){
  const svg = $('arrows'), stage = $('stage');
  const srect = stage.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${srect.width} ${srect.height}`);
  const parts = [];
  for (const key in step.cells){
    const c = step.cells[key];
    if (!c.prev || c.state==='unvisited') continue;
    if (c.state==='path') continue;
    const a = centerOf(c.x,c.y,srect), b = centerOf(c.prev[0],c.prev[1],srect);
    if (a && b){
      parts.push(`<line class="thread" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`);
      parts.push(`<circle class="thread-dot" cx="${b.x}" cy="${b.y}" r="3"/>`);
    }
  }
  svg.innerHTML = parts.join('');
  if (step.isBacktrack && step.reachable && step.path.length>1){
    const pts = [...step.path].reverse().map(([x,y]) => centerOf(x,y,srect));
    const d = pts.map((p,i) => `${i?'L':'M'}${p.x} ${p.y}`).join(' ');
    const path = document.createElementNS(NS,'path');
    path.setAttribute('class','route'); path.setAttribute('d', d);
    svg.appendChild(path);
    if (!reduceMotion){
      const len = path.getTotalLength();
      path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
      path.animate([{strokeDashoffset:len},{strokeDashoffset:0}],
        {duration:900, easing:'cubic-bezier(.2,.8,.2,1)', fill:'both'});
    }
  }
}
function animateDiscover(step){
  if (reduceMotion) return;
  (step.discovered||[]).forEach(([x,y],k) => {
    const el = cellEl(x,y); if(!el) return;
    el.animate([{opacity:.3, transform:'scale(.7)'}, {opacity:1, transform:'scale(1)'}],
      {duration:240, delay:k*80, easing:'cubic-bezier(.2,.9,.3,1.2)', fill:'both'});
  });
  if (step.deq){
    const el = cellEl(step.deq[0], step.deq[1]);
    if (el) el.animate([{transform:'scale(1)'},{transform:'scale(1.09)'},{transform:'scale(1)'}],
      {duration:340, easing:'ease-out'});
  }
  if (step.examine){
    const el = cellEl(step.examine[0], step.examine[1]);
    if (el) el.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],
      {duration:300, easing:'cubic-bezier(.2,.9,.3,1.2)'});
  }
}
function chipEl(x,y){ return document.querySelector(`#queue .chip[data-x="${x}"][data-y="${y}"]`); }
function flashEl(el){
  if (!el) return;
  el.animate(
    [{ boxShadow:'0 0 0 4px rgba(245,158,11,.9)', transform:'scale(1.08)' },
     { boxShadow:'0 0 0 10px rgba(245,158,11,0)', transform:'scale(1)' }],
    { duration:850, easing:'cubic-bezier(.2,.8,.2,1)' });
}

function render(){
  if (state.mode === 'edit'){
    renderEditGrid(); clearArrows();
    renderQueue(null); renderProc(null);
    $('counter').textContent = '편집 중';
    $('hint').textContent = `${state.W}×${state.H} · [벽]/[비싼 칸] 고른 뒤 드래그(같은 칸 재드래그=지우기) · S/G 드래그=이동`;
  } else {
    const step = state.trace[state.i];
    renderGrid(step); renderArrows(step); renderQueue(step); renderProc(step);
    animateDiscover(step);
    $('counter').textContent = `스텝 ${state.i} / ${state.trace.length-1}`;
    $('hint').textContent = step.isBacktrack
      ? (step.reachable ? step.caption : '도착 지점에 이르는 길이 없습니다. 벽을 지우거나 도착을 옮겨 보세요.')
      : step.caption;
  }
  $('procnote').textContent = procNoteText();
  syncControls();
}
function syncControls(){
  const editing = state.mode === 'edit';
  $('app').dataset.mode = state.mode;
  $('btnRun').disabled = !editing;
  $('btnEdit').disabled = editing;
  $('btnClearWalls').disabled = !editing;
  $('inW').disabled = !editing; $('inH').disabled = !editing; $('btnApply').disabled = !editing;
  $('selExample').disabled = !editing;
  $('brush').querySelectorAll('button').forEach(b=>b.disabled = !editing);
  $('btnPrev').disabled = editing || state.i<=0;
  $('btnNext').disabled = editing || state.i>=state.trace.length-1;
  $('btnPlay').disabled = editing;
}

// ===== EDIT INTERACTIONS =====
const drag = { active:false, type:null, paint:null };
function cellFromEvent(e){
  const c = e.target.closest('.cell'); if (!c) return null;
  return [ +c.dataset.x, +c.dataset.y ];
}
function applyPaint(x,y){
  if (eq([x,y],state.start) || eq([x,y],state.goal)) return;
  const k = kk(x,y);
  if (state.brush==='wall'){
    if (drag.paint==='draw'){ state.walls.add(k); state.costs.delete(k); } else state.walls.delete(k);
  } else { // cost
    if (drag.paint==='draw'){ state.costs.add(k); state.walls.delete(k); } else state.costs.delete(k);
  }
}
function onDown(e){
  if (state.mode!=='edit') return;
  const p = cellFromEvent(e); if (!p) return;
  e.preventDefault();
  drag.active = true;
  if (eq(p,state.start)) drag.type='start';
  else if (eq(p,state.goal)) drag.type='goal';
  else {
    drag.type='paint';
    const k = kk(p[0],p[1]);
    const has = state.brush==='wall' ? state.walls.has(k) : state.costs.has(k);
    drag.paint = has ? 'erase' : 'draw';
    applyPaint(p[0],p[1]); render();
  }
}
function onOver(e){
  if (!drag.active || state.mode!=='edit') return;
  if (e.buttons === 0){ onUp(); return; }
  const p = cellFromEvent(e); if (!p) return;
  const [x,y] = p;
  if (drag.type==='start'){
    if (!eq(p,state.goal) && !state.walls.has(kk(x,y))){ state.start=[x,y]; state.costs.delete(kk(x,y)); render(); }
  } else if (drag.type==='goal'){
    if (!eq(p,state.start) && !state.walls.has(kk(x,y))){ state.goal=[x,y]; state.costs.delete(kk(x,y)); render(); }
  } else if (drag.type==='paint'){
    applyPaint(x,y); render();
  }
}
function onUp(){ drag.active=false; drag.type=null; drag.paint=null; }

// ===== CONTROLLER =====
function startSearch(){
  const tr = buildTrace(mapFromState(), state.orderKey, state.granularity);
  state.trace = tr; state.i = 0; state.mode = 'play';
  render();
}
function backToEdit(){ stopPlay(); state.mode='edit'; render(); }
function goto(i){ state.i = Math.max(0, Math.min(state.trace.length-1, i)); render(); }
function next(){ goto(state.i+1); }
function prev(){ goto(state.i-1); }
let timer=null;
function setPlayIcon(on){ $('btnPlay').textContent = on ? '⏸ 일시정지' : '▷ 재생'; }
function startPlay(){ if(state.i>=state.trace.length-1) goto(0);
  timer=setInterval(()=>{ if(state.i>=state.trace.length-1) stopPlay(); else next(); }, 200);   // 0.2초/스텝
  setPlayIcon(true); }
function stopPlay(){ if(timer){ clearInterval(timer); timer=null; } setPlayIcon(false); }
function togglePlay(){ if(state.mode!=='play') return; timer? stopPlay() : startPlay(); }

function applySize(){
  const w = Math.max(2, Math.min(14, parseInt($('inW').value)||state.W));
  const h = Math.max(2, Math.min(14, parseInt($('inH').value)||state.H));
  state.W = w; state.H = h;
  $('inW').value = w; $('inH').value = h;
  state.start = [Math.min(state.start[0],w-1), Math.min(state.start[1],h-1)];
  state.goal  = [Math.min(state.goal[0], w-1), Math.min(state.goal[1], h-1)];
  if (eq(state.start,state.goal)) state.goal = [w-1,h-1];
  for (const set of [state.walls, state.costs])
    for (const k of [...set]){ const [x,y]=k.split(',').map(Number); if(!inBounds(x,y)) set.delete(k); }
  render();
}
function clearWalls(){ state.walls.clear(); state.costs.clear(); render(); }
function setBrush(b){
  state.brush = b;
  $('brush').querySelectorAll('button').forEach(btn=>btn.classList.toggle('on', btn.dataset.brush===b));
}

// ===== INIT =====
const chk = selfCheck();
if (!chk.ok) console.error('SELFTEST FAIL:', chk.fails);
else console.log('SELFTEST PASS');

// 예시 드롭다운
$('selExample').innerHTML = EXAMPLES.map((e,i)=>`<option value="${i}">${e.name}</option>`).join('');
$('qlabel').textContent = (ALGO==='astar')
  ? '큐 · 연회색=꺼낸 칸(기록) · 오른쪽=대기(f=g+h 작은 순) · ▶ 다음에 꺼낼 칸'
  : '큐 · 연회색=꺼낸 칸(기록) · 오른쪽=대기(g 작은 순) · ▶ 다음에 꺼낼 칸';
$('proctitle').textContent = (ALGO==='astar') ? 'A* 절차' : 'Dijkstra 절차';

// 이벤트 배선
const g = $('grid');
g.addEventListener('mousedown', onDown);
g.addEventListener('mouseover', onOver);
document.addEventListener('mouseup', onUp);
g.addEventListener('click', e => {
  if (state.mode !== 'play') return;
  const cell = e.target.closest('.cell'); if (!cell) return;
  flashEl(chipEl(cell.dataset.x, cell.dataset.y));
});
$('queue').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (!chip) return;
  flashEl(cellEl(+chip.dataset.x, +chip.dataset.y));
});
$('btnRun').addEventListener('click', startSearch);
$('btnEdit').addEventListener('click', backToEdit);
$('btnClearWalls').addEventListener('click', clearWalls);
$('btnApply').addEventListener('click', applySize);
$('btnPrev').addEventListener('click', prev);
$('btnNext').addEventListener('click', next);
$('btnPlay').addEventListener('click', togglePlay);
$('selExample').addEventListener('change', e => loadExample(+e.target.value));
$('brush').addEventListener('click', e => { const b=e.target.closest('button'); if(b) setBrush(b.dataset.brush); });
$('selOrder').addEventListener('change', e => { state.orderKey = e.target.value; if (state.mode==='play') startSearch(); });
$('selGran').addEventListener('change', e => { state.granularity = e.target.value; if (state.mode==='play') startSearch(); });
$('chkNumbers').addEventListener('change', e => { state.showNumbers = e.target.checked; render(); });
$('inW').addEventListener('keydown', e => { if(e.key==='Enter') applySize(); });
$('inH').addEventListener('keydown', e => { if(e.key==='Enter') applySize(); });
document.addEventListener('keydown', e => {
  if (state.mode!=='play') return;
  if (e.key==='ArrowRight') next();
  else if (e.key==='ArrowLeft') prev();
  else if (e.key===' '){ e.preventDefault(); togglePlay(); }
  else if (e.key.toLowerCase()==='r') goto(0);
});
window.addEventListener('resize', () => { if(state.trace||state.mode==='edit') render(); });

// 시작: 예시 1 로드
loadExample(0);
</script>

</body>
</html>
