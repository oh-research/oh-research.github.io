<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경로탐색 분할 뷰어 · BFS</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f5f5f7; --ink:#1d1d1f; --muted:#86868b; --line:#e3e3e8;
    --unvisited:#f2f2f4; --queued:#dbeafe; --current:#2563eb; --done:#c7d2da;
    --path:#22c55e; --wall:#5b6470; --accent:#0071e3;
    --start:#34c759; --goal:#ff3b30;
    --radius:14px; --shadow:0 6px 20px rgba(0,0,0,.08);
    --btn:#ffffff;
    --cell:56px; --W:5;
  }
  * { box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",sans-serif; }
  button{ font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--btn); color:var(--ink);
    padding:8px 14px; border-radius:10px; transition:background .15s,box-shadow .15s,transform .05s; }
  button:hover:not(:disabled){ background:var(--panel); }
  button:active:not(:disabled){ transform:translateY(1px); }
  button:disabled{ opacity:.4; cursor:default; }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  button.primary:hover:not(:disabled){ background:#0064c8; }
  input[type=number]{ font:inherit; width:56px; padding:6px 8px; border:1px solid var(--line);
    border-radius:8px; text-align:center; }
  select{ font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  label{ font-size:14px; color:var(--muted); display:inline-flex; align-items:center; gap:6px; }

  #app{ display:flex; flex-direction:column; min-height:100vh; user-select:none; -webkit-user-select:none; }
  input, select{ user-select:auto; -webkit-user-select:auto; }

  /* 상단바 */
  .topbar{ display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    padding:14px 22px; border-bottom:1px solid var(--line); }
  .brand{ font-weight:800; font-size:19px; letter-spacing:-.02em; }
  .topbar .tools{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-left:auto; }

  /* 본문: 좌 절차문 / 우 격자 */
  .body{ flex:1; display:grid; grid-template-columns:minmax(280px,360px) 1fr; gap:24px; padding:22px; }
  @media (max-width:820px){ .body{ grid-template-columns:1fr; } }
  .left{ background:var(--panel); border-radius:var(--radius); padding:20px 22px; align-self:start; }
  .left h2{ margin:0 0 12px; font-size:15px; color:var(--muted); font-weight:700; }
  #proc{ margin:0; padding-left:0; list-style:none; counter-reset:p; }
  #proc > li{ position:relative; padding:10px 12px 10px 40px; margin-bottom:6px; border-radius:10px;
    line-height:1.5; color:#3a3a3c; counter-increment:p; }
  #proc > li::before{ content:counter(p); position:absolute; left:10px; top:10px; width:22px; height:22px;
    border-radius:50%; background:#e5e5ea; color:#6b6b70; font-size:13px; font-weight:700;
    display:grid; place-items:center; }
  #proc > li.active{ background:#fff; color:var(--ink); font-weight:700; box-shadow:var(--shadow); }
  #proc > li.active::before{ background:var(--accent); color:#fff; }
  #proc > li.pgrp{ background:rgba(0,113,227,.05); }
  #proc > li.pgrp > .txt{ font-weight:700; color:var(--ink); }
  /* 3번의 하위 조건 2개 */
  .subproc{ list-style:none; margin:8px 0 2px; padding:0; }
  .subproc li{ position:relative; padding:8px 12px 8px 26px; margin:4px 0 0; border-radius:8px;
    color:#5a5a5e; line-height:1.5; }
  .subproc li::before{ content:''; position:absolute; left:12px; top:15px; width:6px; height:6px;
    border-radius:50%; background:#c4c4c9; }
  .subproc li.active{ background:#fff; color:var(--ink); font-weight:700; box-shadow:var(--shadow); }
  .subproc li.active::before{ background:var(--accent); }
  #procnote{ margin-top:12px; font-size:13px; color:var(--muted); line-height:1.55;
    padding:10px 12px; background:rgba(0,113,227,.06); border-radius:10px; }

  .right{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  #stage{ position:relative; }
  #arrows{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:2; }
  #arrows .thread{ stroke:#aab3c0; stroke-width:2; fill:none; opacity:.5;
    stroke-dasharray:3 4; stroke-linecap:round; }
  #arrows .thread-dot{ fill:#8b96a5; opacity:.6; }
  #arrows .route{ stroke:#16a34a; stroke-width:6; fill:none; stroke-linecap:round; stroke-linejoin:round;
    filter:drop-shadow(0 2px 4px rgba(22,163,74,.35)); }
  #grid{ display:grid; gap:6px; grid-template-columns:repeat(var(--W), var(--cell)); user-select:none; position:relative; z-index:1; }
  .cell{ width:var(--cell); height:var(--cell); border-radius:12px; display:grid; place-items:center;
    font-weight:700; font-size:calc(var(--cell)*.36); background:var(--unvisited);
    box-shadow:0 3px 8px rgba(0,0,0,.05); transition:background .16s, outline-color .16s; }
  .cell .num{ font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace; }
  .cell .ico{ font-weight:800; }
  /* 재생 상태색 */
  .s-queued{ background:var(--queued); }
  .s-current{ background:#fff; outline:3px solid var(--current); }
  .s-done{ background:var(--done); }
  .s-path{ background:var(--path); color:#fff; outline:3px solid #16a34a; }
  .r-start{ outline:3px solid var(--start); }
  .r-goal{ outline:3px solid var(--goal); }
  .r-obstacle{ background:var(--wall);
    background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.14) 6px 12px); }
  .cell-examine{ outline:3px dashed #f59e0b; outline-offset:2px; z-index:3; }   /* 지금 보는 이웃 */
  /* 편집 상태 */
  #app[data-mode="edit"] #grid{ cursor:crosshair; }
  #app[data-mode="play"] #grid .cell{ cursor:pointer; }
  .e-empty{ background:var(--unvisited); }
  .e-wall{ background:var(--wall);
    background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.14) 6px 12px); }
  .e-start{ background:var(--start); color:#fff; }
  .e-goal{ background:var(--goal); color:#fff; }

  .queuewrap{ display:flex; flex-direction:column; gap:8px; align-items:stretch; align-self:center;
    width:100%; max-width:520px; min-height:34px; }
  .qlabel{ font-size:13px; color:var(--muted); font-weight:700; }
  #queue{ display:grid; grid-template-columns:repeat(8, 1fr); gap:5px; }
  .chip{ font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace; font-size:13px;
    padding:5px 4px; border-radius:8px; background:#eef1f4; color:#48484a; cursor:pointer;
    text-align:center; white-space:nowrap; }
  .chip.next{ background:var(--current); color:#fff; font-weight:700; }
  .chip.done{ background:#f2f2f4; color:#b3b3b8; }   /* 처리 끝난 칸 — 연회색으로 남김 */
  .chip.cur{ background:#fff; outline:2px solid var(--current); color:var(--current); font-weight:700; }
  .hint{ font-size:13px; color:var(--muted); text-align:center; max-width:520px; }

  /* 하단바 */
  .bottombar{ display:flex; align-items:center; gap:24px; flex-wrap:wrap;
    padding:14px 22px; border-top:1px solid var(--line); }
  .grp{ display:flex; align-items:center; gap:8px; }
  .vdiv{ width:1px; align-self:stretch; min-height:22px; background:var(--line); margin:0 6px; }
  #counter{ font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace; font-size:14px;
    min-width:96px; text-align:center; color:var(--muted); }
  .spacer{ margin-left:auto; }

</style>
</head>
<body>
<div id="app" data-mode="edit">

  <header class="topbar">
    <div class="brand">경로탐색 뷰어 · BFS</div>
    <div class="tools">
      <label>예시 <select id="selExample"></select></label>
      <label>가로 <input id="inW" type="number" min="2" max="14" value="7"></label>
      <label>세로 <input id="inH" type="number" min="2" max="14" value="5"></label>
      <button id="btnApply">크기 적용</button>
      <label>이웃 순서
        <select id="selOrder">
          <option value="ENWS">동북서남</option>
          <option value="NESW">북동남서</option>
        </select>
      </label>
      <label>③ 이웃 보기
        <select id="selGran">
          <option value="neighbor">하나씩 나눠서</option>
          <option value="dequeue">한 번에</option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" id="chkNumbers"> 거리 번호</label>
    </div>
  </header>

  <main class="body">
    <section class="left">
      <h2>BFS 절차</h2>
      <ol id="proc"></ol>
      <div id="procnote"></div>
    </section>
    <section class="right">
      <div id="stage"><div id="grid"></div><svg id="arrows"></svg></div>
      <div class="queuewrap"><span class="qlabel">큐 · 넣은 순서대로 · ▶ 다음 디큐 · 연회색은 처리 완료</span><div id="queue"></div></div>
      <div id="hint" class="hint"></div>
    </section>
  </main>

  <footer class="bottombar">
    <div class="grp">
      <button id="btnClearWalls">벽 지우기</button>
    </div>
    <div class="grp spacer">
      <button id="btnEdit">✎ 편집으로</button>
      <button id="btnRun" class="primary">▶ 탐색 시작</button>
      <span class="vdiv"></span>
      <button id="btnPrev">◀ 이전</button>
      <span id="counter">편집 중</span>
      <button id="btnNext">다음 ▶</button>
      <button id="btnPlay">▷ 재생</button>
    </div>
  </footer>

</div>

<script>
// ===== CONFIG =====
const MAPS = {
  "3x3": { W:3, H:3, start:[0,0], goal:[2,2], obstacles:[[1,1]] },   // self-test 픽스처
};
// 예시(프리셋) 맵 — Dijkstra/A* 뷰어와 공유하는 3×3 벽 맵 포함
const EXAMPLES = [
  { name:'빈 격자 7×5 (자유 편집)', W:7, H:5, start:[0,0], goal:[6,4], obstacles:[] },
  { name:'3×3 벽 (Dijkstra·A*와 공유)', W:3, H:3, start:[0,0], goal:[2,2], obstacles:[[1,1]] },
];
const NEIGHBOR_ORDERS = {
  ENWS: [[1,0],[0,1],[-1,0],[0,-1]], // 동북서남 (기본)
  NESW: [[0,1],[1,0],[0,-1],[-1,0]], // 북동남서 (대안: 다른 최단경로 시연)
};
const fmt = (c) => `(${c[0]},${c[1]})`;
const dirLabel = (dx,dy) => dx===1?'동':dx===-1?'서':dy===1?'북':'남';

// ===== TRACE ENGINE ===== (검증됨 — §5 오라클과 일치, self-test로 보증)
function buildTrace(map, orderKey, granularity='dequeue') {
  const order = NEIGHBOR_ORDERS[orderKey];
  const oLabel = orderKey==='NESW' ? '북동남서' : '동북서남';
  const fine = (granularity === 'neighbor');   // 이웃 하나씩 미세 스텝
  const { W, H, start, goal, obstacles } = map;
  const key = (x,y) => `${x},${y}`;
  const inB = (x,y) => x>=0 && x<W && y>=0 && y<H;
  const isObs = (x,y) => obstacles.some(o => o[0]===x && o[1]===y);

  const cells = {};
  for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
    let role = null;
    if (start[0]===x && start[1]===y) role='start';
    else if (goal[0]===x && goal[1]===y) role='goal';
    else if (isObs(x,y)) role='obstacle';
    cells[key(x,y)] = { x, y, role, state:'unvisited', dist:null, prev:null };
  }
  const queue = [];
  const steps = [];
  let qseq = 0;                 // 큐에 넣은 순서(입력 순) — 처리 후에도 표시용
  const snap = (extra) => ({
    cells: JSON.parse(JSON.stringify(cells)),
    queue: queue.map(c => [...c]),
    ...extra,
  });

  // 초기화: 시작 칸 enqueue
  cells[key(start[0],start[1])].dist = 0;
  cells[key(start[0],start[1])].state = 'queued';
  cells[key(start[0],start[1])].qorder = qseq++;
  queue.push([...start]);
  steps.push(snap({ deq:null, discovered:[[...start]], procLine:1,
    caption:`시작 칸 ${fmt(start)}을 큐에 넣는다 (거리 0).` }));

  let found = (start[0]===goal[0] && start[1]===goal[1]);
  let lastCur = null;               // 이웃 모드: 직전 '지금 칸'을 다음 디큐 때 done 처리
  while (queue.length && !found) {
    const [cx,cy] = queue.shift();
    if (lastCur) cells[key(lastCur[0],lastCur[1])].state = 'done';
    cells[key(cx,cy)].state = 'current';
    lastCur = [cx,cy];

    if (fine) steps.push(snap({ deq:[cx,cy], discovered:[], procLine:2,
      caption:`${fmt([cx,cy])}을 큐에서 꺼낸다. 지금 이 칸을 본다.` }));

    const discovered = [];
    for (const [dx,dy] of order) {
      const nx=cx+dx, ny=cy+dy;
      if (!inB(nx,ny)) continue;                        // 격자 밖: 스텝 없음
      const nc = cells[key(nx,ny)];
      const dName = dirLabel(dx,dy);
      if (nc.role === 'obstacle' || nc.dist !== null) { // 벽이거나 이미 봄 → 건너뜀
        if (fine) steps.push(snap({ deq:null, examine:[nx,ny], outcome:'skip',
          discovered:[], procLine:'3a',
          caption:`${dName}쪽 ${fmt([nx,ny])}은 ${nc.role==='obstacle'?'벽':'이미 본 칸'}이라 건너뛴다.` }));
        continue;
      }
      // 처음 보는 칸 → 큐에 넣고 실을 묶는다 (거리 번호 = 지금+1)
      nc.dist = cells[key(cx,cy)].dist + 1;
      nc.prev = [cx,cy];
      nc.state = 'queued';
      nc.qorder = qseq++;
      queue.push([nx,ny]);
      discovered.push([nx,ny]);
      const hit = (nx===goal[0] && ny===goal[1]);
      if (hit) found = true;
      if (fine) steps.push(snap({ deq:null, examine:[nx,ny], outcome:'add',
        discovered:[[nx,ny]], procLine:'3b',
        caption: hit
          ? `${dName}쪽 ${fmt([nx,ny])}이 바로 도착! 큐에 넣고 멈춘다.`
          : `${dName}쪽 ${fmt([nx,ny])}은 처음 보는 칸이다. 큐에 넣고 실을 묶는다.` }));
      if (hit) break;
    }

    if (!fine) {                    // 디큐 모드: 한 번에 처리 (기존 동작)
      cells[key(cx,cy)].state = 'done';
      lastCur = null;
      steps.push(snap({ deq:[cx,cy], discovered, procLine: found?'3b':2,
        caption: found
          ? `${fmt([cx,cy])}에서 도착 ${fmt(goal)}을 발견! 이제 실을 거꾸로 따라간다.`
          : `${fmt([cx,cy])}을 큐에서 꺼내 이웃을 ${oLabel} 순으로 확인.` }));
    }
  }
  if (lastCur) cells[key(lastCur[0],lastCur[1])].state = 'done';

  // 역추적 경로 (도달 가능할 때만 의미 있음)
  const reachable = cells[key(goal[0],goal[1])].dist !== null;
  const path = [];
  if (reachable) {
    let p = [...goal];
    while (p) { path.push(p); const pc = cells[key(p[0],p[1])]; p = pc.prev ? [...pc.prev] : null; }
    path.reverse();
    path.forEach(([x,y]) => { cells[key(x,y)].state = 'path'; });
  }
  steps.push(snap({ deq:null, discovered:[], procLine:5, isBacktrack:true, path, reachable,
    caption: reachable
      ? `최단 경로 (${path.length-1}걸음): ${path.map(fmt).join(' → ')}`
      : `도착 ${fmt(goal)}에 이르는 길이 없습니다. 벽으로 막혀 있어요.` }));

  return steps;
}

// ===== SELF-TEST (§5 오라클 — 손검증 3×3 픽스처로 엔진 보증) =====
function runSelfTest() {
  const t = buildTrace(MAPS["3x3"], "ENWS");
  const deqs = t.filter(s => s.deq).map(s => fmt(s.deq)).join(' ');
  const back = t[t.length-1];
  const pathStr = back.path.map(fmt).join(' ');
  const checks = [
    ["스텝 수 8", t.length === 8],
    ["디큐 순서", deqs === "(0,0) (1,0) (0,1) (2,0) (0,2) (2,1)"],
    ["최단 경로", pathStr === "(0,0) (1,0) (2,0) (2,1) (2,2)"],
    ["4걸음", back.path.length - 1 === 4],
    ["G 발견 스텝 = (2,1) 디큐", (() => {
      const g = t.find(s => s.discovered && s.discovered.some(d => d[0]===2 && d[1]===2));
      return g && g.deq && g.deq[0]===2 && g.deq[1]===1;
    })()],
  ];
  const fail = checks.filter(c => !c[1]);
  if (fail.length) { console.error("SELFTEST FAIL:", fail.map(c=>c[0])); return false; }
  console.log("SELFTEST PASS (5 checks)");
  return true;
}

// ===== PROC (6단계 분할 · 이웃순서 반영 · 거리 번호는 4번의 '덤') =====
let procBuiltFor = null;
function orderLabel(key){ return key==='NESW' ? '북→동→남→서' : '동→북→서→남'; }
function procSteps(){
  return [
    { pl:'1', text:'출발 칸을 큐에 넣는다.' },
    { pl:'2', text:'큐 맨 앞 칸(지금 칸)을 꺼낸다.' },
    { pl:'3', text:`이웃을 ${orderLabel(state.orderKey)} 순서로 본다.`, subs:[
        { pl:'3a', text:'벽이거나 이미 본 칸이면 건너뛴다.' },
        { pl:'3b', text:'처음 보는 칸이면 큐에 넣고, 온 방향으로 실을 묶는다.' },
      ] },
    { pl:'4', text:'큐가 빌 때까지 2~3을 반복한다 (도착을 넣으면 멈춘다).' },
    { pl:'5', text:'도착에서 실을 거꾸로 따라가면 최단 경로.' },
  ];
}
function buildProc(){
  $('proc').innerHTML = procSteps().map(s => {
    const subs = s.subs
      ? `<ul class="subproc">${s.subs.map(x=>`<li data-pl="${x.pl}"><span class="txt">${x.text}</span></li>`).join('')}</ul>`
      : '';
    return `<li data-pl="${s.pl}"><span class="txt">${s.text}</span>${subs}</li>`;
  }).join('');
}
function procNoteText(){
  return state.showNumbers
    ? "※ 칸에 넣을 때 ‘지금 칸+1’을 적어두면 그게 곧 출발부터 걸음 수(거리). 길찾기 자체엔 없어도 됩니다."
    : "※ 번호(거리)를 끈 상태입니다. 큐와 실만으로 길을 찾습니다. ‘봤음’은 색으로 표시합니다.";
}

// ===== STATE =====
const state = {
  W:7, H:5,
  start:[0,0], goal:[6,4],
  walls: new Set(),          // "x,y"
  orderKey:"ENWS",
  granularity:"neighbor",    // "neighbor"(이웃 하나씩) | "dequeue"(디큐 한 번)
  showNumbers:false,         // 거리 번호 표시 (기본 꺼짐)
  mode:"edit",               // "edit" | "play"
  trace:null, i:0,
};
const kk = (x,y) => `${x},${y}`;
const eq = (a,b) => a[0]===b[0] && a[1]===b[1];
const inBounds = (x,y) => x>=0 && x<state.W && y>=0 && y<state.H;
function mapFromState(){
  return { W:state.W, H:state.H, start:[...state.start], goal:[...state.goal],
    obstacles:[...state.walls].map(s => s.split(',').map(Number)) };
}

// ===== RENDER (공통 크기/격자) =====
const $ = (id) => document.getElementById(id);
function sizeGrid(){
  const g = $('grid');
  const cell = Math.max(30, Math.min(64,
    Math.floor(Math.min((window.innerWidth*0.52)/state.W, (window.innerHeight*0.60)/state.H))));
  g.style.setProperty('--cell', cell+'px');
  g.style.setProperty('--W', state.W);
}
function newCell(x,y){
  const el = document.createElement('div');
  el.className = 'cell'; el.dataset.x = x; el.dataset.y = y;
  return el;
}

// --- 편집 격자 ---
function renderEditGrid(){
  sizeGrid();
  const g = $('grid'); g.innerHTML = '';
  for (let row=0; row<state.H; row++){
    const y = state.H-1-row;            // 좌하단 원점
    for (let x=0; x<state.W; x++){
      const el = newCell(x,y);
      if (eq([x,y],state.start)){ el.classList.add('e-start'); el.innerHTML = `<span class="ico">S</span>`; }
      else if (eq([x,y],state.goal)){ el.classList.add('e-goal'); el.innerHTML = `<span class="ico">G</span>`; }
      else if (state.walls.has(kk(x,y))) el.classList.add('e-wall');
      else el.classList.add('e-empty');
      g.appendChild(el);
    }
  }
}

// --- 재생 격자 (스냅샷 → DOM) ---
function renderGrid(step){
  sizeGrid();
  const g = $('grid'); g.innerHTML = '';
  for (let row=0; row<state.H; row++){
    const y = state.H-1-row;
    for (let x=0; x<state.W; x++){
      const c = step.cells[kk(x,y)];
      const el = newCell(x,y);
      const examined = step.examine && step.examine[0]===x && step.examine[1]===y;
      el.className = `cell s-${c.state}` + (c.role?` r-${c.role}`:'')
        + (examined ? ' cell-examine' : '');
      el.dataset.x = x; el.dataset.y = y;
      if (state.showNumbers && c.dist !== null && c.role!=='start' && c.role!=='goal')
        el.innerHTML = `<span class="num">${c.dist}</span>`;
      if (c.role==='start') el.innerHTML = `<span class="ico">S</span>`;
      if (c.role==='goal')  el.innerHTML = `<span class="ico">G</span>`;
      g.appendChild(el);
    }
  }
}
function renderQueue(step){
  const q = $('queue');
  if (!step){ q.innerHTML = ''; return; }
  // 큐에 한 번이라도 들어온 모든 칸을 '입력 순서'대로 표시(처리 끝난 칸도 연회색으로 남김)
  const enq = Object.values(step.cells)
    .filter(c => c.qorder !== undefined)
    .sort((a,b) => a.qorder - b.qorder);
  const front = step.queue.length ? `${step.queue[0][0]},${step.queue[0][1]}` : null;
  q.innerHTML = enq.map(c => {
    const processed = (c.state === 'done' || c.state === 'path');   // 탐색 마친 칸
    const isCur = (c.state === 'current');                          // 지금 처리 중(이웃 모드)
    const isNext = front === `${c.x},${c.y}`;
    const cls = 'chip' + (processed ? ' done' : '') + (isCur ? ' cur' : '') + (isNext ? ' next' : '');
    return `<span class="${cls}" data-x="${c.x}" data-y="${c.y}">${isNext ? '▶' : ''}${fmt([c.x,c.y])}</span>`;
  }).join('');
}
function renderProc(step){
  if (!$('proc').children.length || procBuiltFor !== state.orderKey){ buildProc(); procBuiltFor = state.orderKey; }
  const pl = step ? String(step.procLine) : null;
  const strong = new Set(), group = new Set();
  if (pl){
    strong.add(pl);
    if (pl==='3a' || pl==='3b') group.add('3');   // 하위 조건 활성 시 상위 '본다'도 진행 표시
  }
  $('proc').querySelectorAll('li[data-pl]').forEach(li => {
    li.classList.toggle('active', strong.has(li.dataset.pl));
    li.classList.toggle('pgrp', group.has(li.dataset.pl));
  });
}

// ===== ANIM / SVG 오버레이 (Task 5·6) =====
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
const cellEl = (x,y) => document.querySelector(`#grid .cell[data-x="${x}"][data-y="${y}"]`);
function centerOf(x,y,srect){
  const el = cellEl(x,y); if(!el) return null;
  const r = el.getBoundingClientRect();
  return { x:r.left-srect.left+r.width/2, y:r.top-srect.top+r.height/2 };
}
function clearArrows(){ $('arrows').innerHTML = ''; }
// 실(prev) 화살표 = 각 발견 칸에서 부모로 향하는 실 + 역추적 초록 경로
function renderArrows(step){
  const svg = $('arrows'), stage = $('stage');
  const srect = stage.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${srect.width} ${srect.height}`);
  const parts = [];
  for (const key in step.cells){
    const c = step.cells[key];
    if (!c.prev || c.state==='unvisited') continue;
    if (c.state==='path') continue;                       // 경로 실은 아래 route로 강조
    const a = centerOf(c.x,c.y,srect), b = centerOf(c.prev[0],c.prev[1],srect);
    if (a && b){
      parts.push(`<line class="thread" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`);
      parts.push(`<circle class="thread-dot" cx="${b.x}" cy="${b.y}" r="3"/>`); // 부모 매듭
    }
  }
  svg.innerHTML = parts.join('');
  // 역추적 초록 경로 (G→S 방향으로 스르륵)
  if (step.isBacktrack && step.reachable && step.path.length>1){
    const pts = [...step.path].reverse().map(([x,y]) => centerOf(x,y,srect));
    const d = pts.map((p,i) => `${i?'L':'M'}${p.x} ${p.y}`).join(' ');
    const path = document.createElementNS(NS,'path');
    path.setAttribute('class','route'); path.setAttribute('d', d);
    svg.appendChild(path);
    if (!reduceMotion){
      const len = path.getTotalLength();
      path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
      path.animate([{strokeDashoffset:len},{strokeDashoffset:0}],
        {duration:900, easing:'cubic-bezier(.2,.8,.2,1)', fill:'both'});
    }
  }
}
// 물결 확산: 새로 발견된 칸을 동북서남 순으로 페이드+스케일, 현재칸 스프링
function animateDiscover(step){
  if (reduceMotion) return;
  (step.discovered||[]).forEach(([x,y],k) => {
    const el = cellEl(x,y); if(!el) return;
    el.animate([{opacity:.3, transform:'scale(.7)'}, {opacity:1, transform:'scale(1)'}],
      {duration:240, delay:k*80, easing:'cubic-bezier(.2,.9,.3,1.2)', fill:'both'});
  });
  if (step.deq){
    const el = cellEl(step.deq[0], step.deq[1]);
    if (el) el.animate([{transform:'scale(1)'},{transform:'scale(1.09)'},{transform:'scale(1)'}],
      {duration:340, easing:'ease-out'});
  }
  if (step.examine){          // 지금 보고 있는 이웃 한 칸 강조 펄스
    const el = cellEl(step.examine[0], step.examine[1]);
    if (el) el.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],
      {duration:300, easing:'cubic-bezier(.2,.9,.3,1.2)'});
  }
}
// 큐 칩 ↔ 격자 칸 상호 하이라이트 (잠깐 반짝)
function chipEl(x,y){ return document.querySelector(`#queue .chip[data-x="${x}"][data-y="${y}"]`); }
function flashEl(el){
  if (!el) return;
  el.animate(
    [{ boxShadow:'0 0 0 4px rgba(245,158,11,.9)', transform:'scale(1.08)' },
     { boxShadow:'0 0 0 10px rgba(245,158,11,0)', transform:'scale(1)' }],
    { duration:850, easing:'cubic-bezier(.2,.8,.2,1)' });
}

function render(){
  if (state.mode === 'edit'){
    renderEditGrid(); clearArrows();
    renderQueue(null); renderProc(null);
    $('counter').textContent = '편집 중';
    $('hint').textContent = `${state.W}×${state.H} · 빈 칸 드래그=벽, 벽 위 드래그=지우기, S/G 드래그=이동`;
  } else {
    const step = state.trace[state.i];
    renderGrid(step); renderArrows(step); renderQueue(step); renderProc(step);
    animateDiscover(step);
    $('counter').textContent = `스텝 ${state.i} / ${state.trace.length-1}`;
    $('hint').textContent = step.isBacktrack
      ? (step.reachable ? `최단 경로 ${step.path.length-1}걸음 (실을 거꾸로 따라간 길)`
                        : '도착 지점에 이르는 길이 없습니다. 벽을 지우거나 도착을 옮겨 보세요.')
      : '← → 이전/다음 · space 재생 · R 처음으로';
  }
  $('procnote').textContent = procNoteText();
  syncControls();
}
function syncControls(){
  const editing = state.mode === 'edit';
  $('app').dataset.mode = state.mode;
  $('btnRun').disabled = !editing;
  $('btnEdit').disabled = editing;
  $('btnClearWalls').disabled = !editing;
  $('inW').disabled = !editing; $('inH').disabled = !editing; $('btnApply').disabled = !editing;
  $('selExample').disabled = !editing;
  $('btnPrev').disabled = editing || state.i<=0;
  $('btnNext').disabled = editing || state.i>=state.trace.length-1;
  $('btnPlay').disabled = editing;
}

// ===== EDIT INTERACTIONS (PathFinding.js식) =====
const drag = { active:false, type:null, paint:null };
function cellFromEvent(e){
  const c = e.target.closest('.cell'); if (!c) return null;
  return [ +c.dataset.x, +c.dataset.y ];
}
function applyPaint(x,y){
  if (eq([x,y],state.start) || eq([x,y],state.goal)) return;
  const k = kk(x,y);
  if (drag.paint === 'draw') state.walls.add(k); else state.walls.delete(k);
}
function onDown(e){
  if (state.mode!=='edit') return;
  const p = cellFromEvent(e); if (!p) return;
  e.preventDefault();
  drag.active = true;
  if (eq(p,state.start)) drag.type='start';
  else if (eq(p,state.goal)) drag.type='goal';
  else { drag.type='paint'; drag.paint = state.walls.has(kk(p[0],p[1]))?'erase':'draw'; applyPaint(p[0],p[1]); render(); }
}
function onOver(e){
  if (!drag.active || state.mode!=='edit') return;
  if (e.buttons === 0){ onUp(); return; }   // 버튼을 뗐으면 드래그 종료(격자 rebuild로 mouseup을 놓친 경우 방어)
  const p = cellFromEvent(e); if (!p) return;
  const [x,y] = p;
  if (drag.type==='start'){
    if (!eq(p,state.goal) && !state.walls.has(kk(x,y))){ state.start=[x,y]; render(); }
  } else if (drag.type==='goal'){
    if (!eq(p,state.start) && !state.walls.has(kk(x,y))){ state.goal=[x,y]; render(); }
  } else if (drag.type==='paint'){
    applyPaint(x,y); render();
  }
}
function onUp(){ drag.active=false; drag.type=null; drag.paint=null; }

// ===== CONTROLLER =====
function startSearch(){
  const tr = buildTrace(mapFromState(), state.orderKey, state.granularity);
  state.trace = tr; state.i = 0; state.mode = 'play';
  render();
}
function backToEdit(){ stopPlay(); state.mode='edit'; render(); }
function goto(i){
  state.i = Math.max(0, Math.min(state.trace.length-1, i));
  render();
}
function next(){ goto(state.i+1); }
function prev(){ goto(state.i-1); }
let timer=null;
function setPlayIcon(on){ $('btnPlay').textContent = on ? '⏸ 일시정지' : '▷ 재생'; }
function startPlay(){ if(state.i>=state.trace.length-1) goto(0);
  timer=setInterval(()=>{ if(state.i>=state.trace.length-1) stopPlay(); else next(); }, 300);   // 0.3초/스텝
  setPlayIcon(true); }
function stopPlay(){ if(timer){ clearInterval(timer); timer=null; } setPlayIcon(false); }
function togglePlay(){ if(state.mode!=='play') return; timer? stopPlay() : startPlay(); }

function applySize(){
  const w = Math.max(2, Math.min(14, parseInt($('inW').value)||state.W));
  const h = Math.max(2, Math.min(14, parseInt($('inH').value)||state.H));
  state.W = w; state.H = h;
  $('inW').value = w; $('inH').value = h;
  // 시작/도착 clamp
  state.start = [Math.min(state.start[0],w-1), Math.min(state.start[1],h-1)];
  state.goal  = [Math.min(state.goal[0], w-1), Math.min(state.goal[1], h-1)];
  if (eq(state.start,state.goal)) state.goal = [w-1,h-1];  // 겹치면 도착을 우상단으로
  // 범위 밖 벽 제거
  for (const k of [...state.walls]){ const [x,y]=k.split(',').map(Number); if(!inBounds(x,y)) state.walls.delete(k); }
  render();
}
function clearWalls(){ state.walls.clear(); render(); }
function loadExample(idx){
  const ex = EXAMPLES[idx]; if(!ex) return;
  state.W = ex.W; state.H = ex.H;
  state.start = [...ex.start]; state.goal = [...ex.goal];
  state.walls = new Set((ex.obstacles||[]).map(o => kk(o[0],o[1])));
  state.mode = 'edit'; state.trace = null; state.i = 0;
  $('inW').value = state.W; $('inH').value = state.H;
  render();
}

// ===== INIT =====
// self-test는 그대로 돌리되 결과는 콘솔로만 알린다(수업 화면에 뱃지를 띄우지 않는다).
if (runSelfTest()) console.log('SELFTEST PASS');
else console.error('SELFTEST FAIL');

// 예시 드롭다운 채우기
$('selExample').innerHTML = EXAMPLES.map((e,i)=>`<option value="${i}">${e.name}</option>`).join('');

// 이벤트 배선
const g = $('grid');
g.addEventListener('mousedown', onDown);
g.addEventListener('mouseover', onOver);
document.addEventListener('mouseup', onUp);
g.addEventListener('click', e => {                 // 재생 중: 칸 클릭 → 큐 칩 반짝
  if (state.mode !== 'play') return;
  const cell = e.target.closest('.cell'); if (!cell) return;
  flashEl(chipEl(cell.dataset.x, cell.dataset.y));
});
$('queue').addEventListener('click', e => {        // 칩 클릭 → 격자 칸 반짝
  const chip = e.target.closest('.chip'); if (!chip) return;
  flashEl(cellEl(+chip.dataset.x, +chip.dataset.y));
});
$('btnRun').addEventListener('click', startSearch);
$('btnEdit').addEventListener('click', backToEdit);
$('btnClearWalls').addEventListener('click', clearWalls);
$('btnApply').addEventListener('click', applySize);
$('selExample').addEventListener('change', e => loadExample(+e.target.value));
$('btnPrev').addEventListener('click', prev);
$('btnNext').addEventListener('click', next);
$('btnPlay').addEventListener('click', togglePlay);
$('selOrder').addEventListener('change', e => {
  state.orderKey = e.target.value;
  if (state.mode==='play') startSearch();   // 재생 중이면 새 순서로 다시 탐색
});
$('selGran').addEventListener('change', e => {
  state.granularity = e.target.value;
  if (state.mode==='play') startSearch();   // 재생 중이면 새 스텝 단위로 다시 탐색
});
$('chkNumbers').addEventListener('change', e => {
  state.showNumbers = e.target.checked;
  render();
});
$('inW').addEventListener('keydown', e => { if(e.key==='Enter') applySize(); });
$('inH').addEventListener('keydown', e => { if(e.key==='Enter') applySize(); });
document.addEventListener('keydown', e => {
  if (state.mode!=='play') return;
  if (e.key==='ArrowRight') next();
  else if (e.key==='ArrowLeft') prev();
  else if (e.key===' '){ e.preventDefault(); togglePlay(); }
  else if (e.key.toLowerCase()==='r') goto(0);
});
window.addEventListener('resize', () => { if(state.trace||state.mode==='edit') render(); });

render();
</script>
